<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Mail bestätigen | HTL Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-{{ theme }}">
    <div class="auth-card">
        <h1>E-Mail verifizieren</h1>
        <p class="subtitle">Wir haben dir einen 6-stelligen Code geschickt. Ohne Bestätigung ist kein Login möglich.</p>
        {% if success_message %}<div class="alert alert--success">{{ success_message }}</div>{% endif %}
        {% if error_message %}<div class="alert alert--error">{{ error_message }}</div>{% endif %}
        <form method="post" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="field">
                <span>Code</span>
                <input name="code" maxlength="6" minlength="6" required pattern="[0-9]{6}" placeholder="123456">
            </label>
            <button class="button" type="submit">Verify</button>
        </form>
        <form method="post" class="stack" style="margin-top:1rem;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="action" value="resend">
            <button class="button button--ghost" type="submit" {% if cooldown>0 %}disabled{% endif %}>
                Code erneut senden {% if cooldown>0 %}(warte {{ cooldown }}s){% endif %}
            </button>
        </form>
        <p class="muted">An: {{ user.email }}</p>
        <a href="{{ url_for('landing') }}" class="link">Zurück</a>
    </div>
</body>
</html>
