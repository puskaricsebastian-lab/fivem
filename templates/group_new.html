<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppe erstellen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-{{ theme }}">
    <header class="topbar">
        <div class="topbar__brand">
            <span class="logo">HTL Upload</span>
            <span class="pill">Gruppen</span>
        </div>
        <nav class="topbar__nav">
            <a href="{{ url_for('app_home') }}">Upload</a>
            <a href="{{ url_for('my_uploads') }}">Meine Dateien</a>
            <a href="{{ url_for('shared_with_me') }}">Mit mir geteilt</a>
            <a href="{{ url_for('shares_mine') }}">Meine Shares</a>
            <a href="{{ url_for('groups_overview') }}" class="active">Gruppen</a>
            <a href="{{ url_for('settings') }}">Einstellungen</a>
            {% if user and user.is_admin %}
                <a href="{{ url_for('admin_panel') }}">Admin</a>
            {% endif %}
        </nav>
        <div class="topbar__actions">
            <form action="{{ url_for('logout') }}" method="post">
                <button class="button button--ghost" type="submit">Logout</button>
            </form>
        </div>
    </header>

    <main class="panel">
        <div class="panel__header">
            <div>
                <p class="eyebrow">Gruppe erstellen</p>
                <h1>Eigene Gruppe starten</h1>
                <p class="subtitle">Du wirst Gruppen-Admin und bestätigst Beitrittsanfragen.</p>
            </div>
        </div>

        {% if error_message %}
        <div class="alert alert--error">{{ error_message }}</div>
        {% endif %}

        <form class="form" action="{{ url_for('create_group_view') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="field">
                <span>Gruppenname</span>
                <input type="text" name="name" placeholder="z.B. Projektteam" required>
            </label>
            <label class="field">
                <span>Beschreibung</span>
                <textarea name="description" rows="3" placeholder="Optional"></textarea>
            </label>
            <button class="button" type="submit">Gruppe anlegen</button>
        </form>
    </main>
</body>
</html>
