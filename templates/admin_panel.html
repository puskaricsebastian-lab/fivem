<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Übersicht</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin theme-{{ theme }}">
    <header class="header">
        <div class="header__content">
            <h1>Admin-Panel</h1>
            <p class="subtitle">Nur für Admins sichtbar. Überblick über Nutzer, Uploads und schnelle Sprünge.</p>
        </div>
        <div class="header__actions">
            <a class="button button--ghost" href="{{ url_for('app_home') }}">Zur App</a>
            <a class="button" href="{{ url_for('admin_uploads') }}">Alle Uploads</a>
        </div>
    </header>

    <main class="panel">
        <div class="stats">
            <div class="stat">
                <p class="eyebrow">Uploads</p>
                <h2>{{ total_uploads }}</h2>
                <p class="muted">Gesamt in der aktuellen Datenbank.</p>
            </div>
            <div class="stat">
                <p class="eyebrow">Nutzer</p>
                <h2>{{ total_users }}</h2>
                <p class="muted">Registrierte Accounts.</p>
            </div>
        </div>
        <div class="panel__section">
            <p class="eyebrow">Abkürzungen</p>
            <div class="chip-row">
                <a class="chip" href="{{ url_for('admin_uploads') }}">Upload-Historie</a>
                <a class="chip" href="{{ url_for('settings') }}">Einstellungen</a>
            </div>
        </div>
    </main>
</body>
</html>
