<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusSafe AI</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <h1>FocusSafe AI</h1>
      <p class="hint">Analyze only what is visible on the active tab. Runs in this side panel so your page stays in focus context.</p>

      <section class="card">
        <label for="prompt">What do you want help with?</label>
        <textarea id="prompt" rows="3" placeholder="Example: Give me a quick summary and action items."></textarea>
        <button id="analyzeBtn">Analyze Visible Page</button>
      </section>

      <section class="card">
        <h2>AI Response</h2>
        <pre id="output">No response yet.</pre>
      </section>

      <section class="card">
        <h2>Settings</h2>
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="gemini">Google Gemini</option>
          <option value="openai_compatible">OpenAI-compatible</option>
        </select>

        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="sk-... / AIza..." autocomplete="off" />

        <label for="model">Model</label>
        <input id="model" type="text" placeholder="gpt-4o-mini / gemini-1.5-flash" />

        <label for="baseUrl">Base URL (nur OpenAI-compatible)</label>
        <input id="baseUrl" type="text" placeholder="https://api.openai.com/v1/chat/completions" />

        <label for="systemPrompt">System Prompt</label>
        <textarea id="systemPrompt" rows="4"></textarea>

        <button id="saveBtn" class="secondary">Save Settings</button>
        <p id="status" class="status"></p>
      </section>

      <section class="card support">
        <h2>Support</h2>
        <p>Bei Problemen schreibe mir auf Discord:</p>
        <a href="https://discord.com/users/1359978831070625875" target="_blank" rel="noreferrer">brezxxx. (ID: 1359978831070625875)</a>
      </section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
